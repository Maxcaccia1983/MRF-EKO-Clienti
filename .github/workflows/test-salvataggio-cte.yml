name: Test CTE - salvataggio, anteprima e lettore universale

on:
  push:
    branches:
      - sviluppo-lettura-economica-cte
    paths:
      - index.html
      - mrf-cte-lettore.js
      - mrf-cte-v11-analisi.js
      - 'tests/**'
      - .github/workflows/test-salvataggio-cte.yml
  pull_request:
    branches:
      - sviluppo-lettura-economica-cte
    paths:
      - index.html
      - mrf-cte-lettore.js
      - mrf-cte-v11-analisi.js
      - 'tests/**'
      - .github/workflows/test-salvataggio-cte.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cte:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa PDF.js per i PDF reali
        run: npm install --no-save --no-package-lock --ignore-scripts pdfjs-dist@3.11.174

      - name: Controlla versione PDF.js
        run: node -e "if (require('pdfjs-dist/package.json').version !== '3.11.174') process.exit(1)"

      - name: Esegui tutti i test CTE, inclusi i PDF reali
        env:
          RICHIEDI_PDF_REALI: '1'
        run: node --test tests/*.test.mjs
